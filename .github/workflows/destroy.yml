name: destroy

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escriba "destruir" para confirmar'
        required: true

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_owner: ${{ github.repository_owner }}

jobs:
  destroy:
    if: inputs.confirmar == 'destruir'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: [prod, dev]
    environment: ${{ matrix.env }}
    env:
      TF_VAR_project_id: ${{ matrix.env == 'dev' && vars.GCP_PROJECT_DEV || vars.GCP_PROJECT_PROD }}
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}"
      - name: Destroy
        run: terraform destroy -auto-approve -input=false -lock-timeout=120s
