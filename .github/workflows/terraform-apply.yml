name: terraform-apply

on:
  push:
    branches: [main]
    paths: ["envs/**", "modules/**", "site/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_owner: ${{ github.repository_owner }}

jobs:
  apply:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1          # primero dev; prod espera a que dev termine
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env }}   # prod exige aprobación manual
    env:
      TF_VAR_project_id: ${{ matrix.env == 'dev' && vars.GCP_PROJECT_DEV || vars.GCP_PROJECT_PROD }}
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}"
      - name: Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=120s
      - name: Publicar la URL del sitio
        run: |
          URL=$(terraform output -raw site_url)
          echo "### ${{ matrix.env }}: $URL" >> "$GITHUB_STEP_SUMMARY"
