name: drift

on:
  schedule:
    - cron: "0 11 * * *"     # todos los días a las 06:00 hora de Bogotá
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_owner: ${{ github.repository_owner }}

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}"
      - name: Plan (detecta deriva)
        id: plan
        continue-on-error: true
        run: >
          terraform plan -no-color -input=false
          -detailed-exitcode -lock-timeout=120s
      - name: Abrir un issue si hay deriva
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          ENTORNO: ${{ matrix.env }}
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Deriva detectada en ${process.env.ENTORNO}`,
              body: "La infraestructura real difiere de lo declarado en Git.\n\n" +
                "```\n" + process.env.PLAN.slice(-60000) + "\n```"
            });
      - name: Fallar si el plan tuvo un error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
